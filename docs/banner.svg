<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img"
     aria-label="v2rayV — the Android V2Ray client that connects itself">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130d"/>
      <stop offset="0.5" stop-color="#0a2019"/>
      <stop offset="1" stop-color="#040f0b"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a0"/>
      <stop offset="1" stop-color="#6c4ef5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- the power dial from the dashboard, in its own segmented ring -->
  <g transform="translate(158,160)">
    <g fill="#2ee6a0">
      <rect x="-5" y="-104" width="10" height="26" rx="4"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(24)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(48)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(72)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(96)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(120)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(144)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(168)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(192)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(216)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(240)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(264)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(288)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(312)"/>
      <rect x="-5" y="-104" width="10" height="26" rx="4" transform="rotate(336)"/>
    </g>
    <circle r="60" fill="none" stroke="#2ee6a0" stroke-width="3" opacity="0.55"/>
    <g stroke="#2ee6a0" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M0,-34 L0,2"/>
      <path d="M-24,-20 A32,32 0 1,0 24,-20"/>
    </g>
  </g>

  <text x="300" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="66" font-weight="300" fill="#f4fffa" letter-spacing="2">v2rayV</text>

  <text x="302" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="25" fill="#94c6b4">The Android V2Ray client that connects itself</text>

  <text x="302" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="21" fill="#5f8f7d">VLESS · Reality · VMess · Trojan · Shadowsocks · Hysteria2 · TUIC</text>

  <rect x="302" y="240" width="440" height="3" rx="1.5" fill="url(#rule)"/>

  <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17" fill="#2ee6a0" opacity="0.9">
    <text x="302" y="284">one press → measured → connected</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="1112" y="150" font-size="44" font-weight="700" fill="#2ee6a0">0.70</text>
    <text x="1112" y="180" font-size="15" fill="#5f8f7d" letter-spacing="2">OF YOUR OWN LINE</text>
    <text x="1112" y="206" font-size="15" fill="#5f8f7d" letter-spacing="2">IS THE BAR</text>
  </g>
</svg>
