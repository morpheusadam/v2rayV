name = "v2rayv-mirror"
main = "worker.js"
compatibility_date = "2026-08-16"

# The account this deploys to. Not a secret: it identifies, it does not authorise.
account_id = "2c8d31a2d7fc9c07ef8e1a30520212d4"

# Where the client looks for it. Must match AutoModeNetwork.MIRRORS[0] in the app.
routes = [
  { pattern = "cdn.lavzen.com/gh/*", zone_name = "lavzen.com" },
]

# The store the mirror answers from. Free tier covers this many times over: the lists are a
# few megabytes in total and the whole point is that they are read far more than written.
[[r2_buckets]]
binding = "MIRROR"
bucket_name = "v2rayv-mirror"

[vars]
# Refreshed on the cron below whether or not anybody asked, so that during a blackout — when
# reaching GitHub from a phone is least likely and the mirror matters most — the copy is
# already warm rather than being fetched on the critical path.
WARM_PATHS = "/gh/morpheusadam/v2ray-config@main/subs/bundles/best.txt,/gh/morpheusadam/v2ray-config@main/subs/all.txt,/gh/morpheusadam/v2ray-config@main/proxies/all.txt,/gh/morpheusadam/v2ray-config@main/app/notice.json"

[triggers]
crons = ["17 * * * *"]
